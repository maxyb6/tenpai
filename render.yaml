# Render blueprint: one web service (console + API in one image) and Postgres.
# In Render: New > Blueprint > pick this repo. Set DEMO_PASSWORD when asked.
databases:
  - name: tenpai-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: tenpai-demo
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: tenpai-db, property: connectionString}
      - key: SEED_ON_START
        value: "true"
      - key: LINK_SIGNING_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
      - key: DEMO_AS_OF
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATA_HOSTING_REGION
        value: Singapore (Render, singapore region)
