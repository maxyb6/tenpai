# docker compose up --build   then open http://localhost:8000
# The sample data seeds itself on first start (about 4 minutes).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tenpai
      POSTGRES_PASSWORD: tenpai
      POSTGRES_DB: tenpai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenpai"]
      interval: 2s
      retries: 30

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://tenpai:tenpai@db:5432/tenpai
      SEED_ON_START: "true"
      PUBLIC_BASE_URL: http://localhost:8000
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
