services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tenpai
      POSTGRES_PASSWORD: tenpai
      POSTGRES_DB: tenpai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenpai"]
      interval: 2s
      retries: 20

  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://tenpai:tenpai@db:5432/tenpai
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: [./sample_data:/app/sample_data]

volumes:
  pgdata:
